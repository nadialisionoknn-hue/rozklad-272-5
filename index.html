<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="272-5">
<meta name="theme-color" content="#000000">
<title>Розклад 272-5</title>
<style>
:root {
  --bg:#000;
  --surface:#0b0b0d;
  --surface2:#141417;
  --surface3:#1c1c1f;
  --text:#f5f5f7;
  --muted:#8e8e93;
  --line:#232326;
  --accent:#ffffff;
  --accentText:#000000;
  --green:#30d158;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit}
.app{min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.header{padding:18px 16px 8px;position:sticky;top:0;z-index:20;background:linear-gradient(#000 82%,rgba(0,0,0,.92));backdrop-filter:blur(18px)}
.titleRow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:34px;line-height:1;font-weight:800;letter-spacing:-1.2px;margin:0}
.dateLabel{font-size:13px;color:var(--muted);white-space:nowrap;padding-bottom:4px}
.segment{margin-top:16px;background:var(--surface2);padding:3px;border-radius:12px;display:grid;grid-template-columns:1fr 1fr}
.segment button{height:38px;border:0;background:transparent;border-radius:9px;color:var(--muted);font-weight:700}
.segment button.active{background:#2c2c2e;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.7)}
.daystrip{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.daystrip::-webkit-scrollbar{display:none}
.daybtn{min-width:68px;border:1px solid var(--line);background:var(--surface);padding:10px 10px 9px;border-radius:16px;scroll-snap-align:center;text-align:center}
.daybtn .abbr{font-size:12px;color:var(--muted);font-weight:700}
.daybtn .num{font-size:20px;font-weight:800;margin-top:3px}
.daybtn.active{background:#fff;color:#000;border-color:#fff}
.daybtn.active .abbr{color:#666}
.daybtn.today:not(.active){border-color:#48484a}
.content{padding:8px 14px 20px;touch-action:pan-y}
.dayTitle{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 10px}
.dayTitle h2{font-size:24px;margin:0;letter-spacing:-.4px}
.count{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;margin-bottom:11px;padding:15px;display:grid;grid-template-columns:68px 1fr;gap:14px}
.time{font-size:20px;font-weight:800;letter-spacing:-.4px}
.pair{font-size:12px;color:var(--muted);margin-top:4px}
.subject{font-size:18px;line-height:1.25;font-weight:750;letter-spacing:-.2px}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.pill{font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:7px 9px;color:#d1d1d6}
.pill.room{color:var(--green)}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:38px 20px;text-align:center;color:var(--muted);margin-top:6px}
.empty strong{display:block;color:#fff;font-size:20px;margin-bottom:6px}
.swipeHint{text-align:center;color:#48484a;font-size:12px;padding:8px 0 2px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(10,10,10,.88);backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,.08)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:520px;margin:auto}
.nav button{border:0;background:transparent;border-radius:14px;height:56px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700}
.nav .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.nav button.active{color:#fff;background:var(--surface3)}
.nav button.active .dot{background:#fff}
.nav .small{font-size:11px}
@media(min-width:700px){
  .app{max-width:680px;margin:auto;border-left:1px solid #111;border-right:1px solid #111}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="titleRow">
      <h1>272-5</h1>
      <div class="dateLabel" id="dateLabel"></div>
    </div>
    <div class="segment">
      <button id="weekI" onclick="setWeek('I')">І тиждень</button>
      <button id="weekII" onclick="setWeek('II')">ІІ тиждень</button>
    </div>
    <div class="daystrip" id="daystrip"></div>
  </header>

  <main class="content" id="swipeArea">
    <div class="dayTitle">
      <h2 id="dayTitle"></h2>
      <span class="count" id="count"></span>
    </div>
    <div id="list"></div>
    <div class="swipeHint">← свайп для зміни дня →</div>
  </main>
</div>

<div class="bottom">
  <nav class="nav" id="bottomNav"></nav>
</div>

<script>
const data=[{"day": "Понеділок", "pair": 1, "time": "08:20", "week_I": "Екон-мат методи та моделі (л)", "week_II": "Екон-мат методи та моделі (л)", "teacher": "Григорків ВС.", "room": "к 14 а 45"}, {"day": "Понеділок", "pair": 2, "time": "09:50", "week_I": "Екон-мат методи та моделі (лаб)", "week_II": "Екон-мат методи та моделі (лаб)", "teacher": "Іщенко С.В.", "room": "к 14 а 48, 66"}, {"day": "Понеділок", "pair": 3, "time": "11:30", "week_I": "ОНС", "week_II": "ОНС", "teacher": "", "room": ""}, {"day": "Понеділок", "pair": 4, "time": "13:00", "week_I": "ОНС, ДВ", "week_II": "", "teacher": "", "room": ""}, {"day": "Понеділок", "pair": 5, "time": "14:40", "week_I": "ОНС", "week_II": "", "teacher": "", "room": ""}, {"day": "Вівторок", "pair": 2, "time": "09:50", "week_I": "Фінанси (пр)", "week_II": "Фінанси (пр)", "teacher": "Легкоступ І І.", "room": "к 14 а 54"}, {"day": "Вівторок", "pair": 4, "time": "13:00", "week_I": "Банківська система (л)", "week_II": "Банківська система (л)", "teacher": "Марич М.Г.", "room": "к 2 а 216"}, {"day": "Вівторок", "pair": 5, "time": "14:40", "week_I": "Фінанси (л)", "week_II": "Фінанси (л)", "teacher": "Марусяк Н.Л.", "room": "к 2 а 216"}, {"day": "Середа", "pair": 1, "time": "08:20", "week_I": "", "week_II": "Банківська система (пр)", "teacher": "Олексин А.Г.", "room": "к 14а 68"}, {"day": "Середа", "pair": 2, "time": "09:50", "week_I": "Макроекономіка (пр)", "week_II": "Макроекономіка (пр)", "teacher": "Мінічев О.В.", "room": "к 19 а 206"}, {"day": "Середа", "pair": 4, "time": "13:00", "week_I": "Загальноуніверситетські вибіркові дисципліни", "week_II": "Загальноуніверситетські вибіркові дисципліни", "teacher": "", "room": "онлайн"}, {"day": "Середа", "pair": 5, "time": "14:40", "week_I": "", "week_II": "ДВВ (пр)", "teacher": "", "room": "онлайн"}, {"day": "Середа", "pair": 6, "time": "16:10", "week_I": "ДВВ (л)", "week_II": "ДВВ (пр)", "teacher": "", "room": "онлайн"}, {"day": "Четвер", "pair": 1, "time": "08:20", "week_I": "Банківська система (пр)", "week_II": "Банківська система (пр)", "teacher": "Олексин А.Г.", "room": "к 19 а 207"}, {"day": "Четвер", "pair": 2, "time": "09:50", "week_I": "Фінанси (пр)", "week_II": "Фінанси (пр)", "teacher": "Легкоступ І І.", "room": "к 19 а 207"}, {"day": "Четвер", "pair": 3, "time": "11:30", "week_I": "Іноземна мова за ПС", "week_II": "Іноземна мова за ПС", "teacher": "Паранюк", "room": "к 19 а 207"}, {"day": "Четвер", "pair": 4, "time": "13:00", "week_I": "Менеджмент (пр)", "week_II": "Менеджмент (пр)", "teacher": "Гушилик А.Б.", "room": "к 19 а 207"}, {"day": "П’ятниця", "pair": 3, "time": "11:30", "week_I": "Менеджмент (л)", "week_II": "Менеджмент (л)", "teacher": "Клевчік Л.Л.", "room": "к 1 а 39"}, {"day": "П’ятниця", "pair": 4, "time": "13:00", "week_I": "Макроекономіка (л)", "week_II": "Макроекономіка (л)", "teacher": "Сторощук Б.Д.", "room": "к 14 а 39"}];
const days=['Понеділок','Вівторок','Середа','Четвер','П’ятниця'];
const abbr={'Понеділок':'Пн','Вівторок':'Вт','Середа':'Ср','Четвер':'Чт','П’ятниця':'Пт'};
const jsToDay={1:'Понеділок',2:'Вівторок',3:'Середа',4:'Четвер',5:'П’ятниця'};

function mondayOfCurrentWeek(){
  const d=new Date(); const js=d.getDay()||7;
  const m=new Date(d); m.setDate(d.getDate()-(js-1)); m.setHours(12,0,0,0); return m;
}
function dateForDay(day){
  const m=mondayOfCurrentWeek(); const i=days.indexOf(day);
  const d=new Date(m); d.setDate(m.getDate()+i); return d;
}
function fmtDate(d){
  return d.toLocaleDateString('uk-UA',{day:'numeric',month:'short'});
}
function todayDay(){return jsToDay[new Date().getDay()]||'Понеділок'}

let week=localStorage.getItem('schedule2725week')||'I';
let day=localStorage.getItem('schedule2725day')||todayDay();
if(!days.includes(day)) day='Понеділок';

function setWeek(w){week=w;localStorage.setItem('schedule2725week',w);render();}
function setDay(d){day=d;localStorage.setItem('schedule2725day',d);render(); window.scrollTo({top:0,behavior:'smooth'});}

function render(){
  document.getElementById('weekI').classList.toggle('active',week==='I');
  document.getElementById('weekII').classList.toggle('active',week==='II');
  document.getElementById('dateLabel').textContent=(week==='I'?'І':'ІІ')+' тиждень · '+fmtDate(dateForDay(day));
  document.getElementById('dayTitle').textContent=day;

  const lessons=data.filter(x=>x.day===day && (week==='I'?x.week_I:x.week_II));
  document.getElementById('count').textContent=lessons.length ? lessons.length+' '+(lessons.length===1?'пара':'пари') : 'вільний день';

  const strip=document.getElementById('daystrip');
  const nav=document.getElementById('bottomNav');
  strip.innerHTML=''; nav.innerHTML='';

  days.forEach(d=>{
    const date=dateForDay(d);
    const b=document.createElement('button');
    b.className='daybtn'+(d===day?' active':'')+(d===todayDay()?' today':'');
    b.innerHTML=`<div class="abbr">${abbr[d]}</div><div class="num">${date.getDate()}</div>`;
    b.onclick=()=>setDay(d);
    strip.appendChild(b);

    const n=document.createElement('button');
    if(d===day)n.classList.add('active');
    n.innerHTML=`<span>${abbr[d]}</span><span class="dot"></span>`;
    n.onclick=()=>setDay(d);
    nav.appendChild(n);
  });

  requestAnimationFrame(()=>{
    const active=strip.querySelector('.active');
    if(active) active.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  });

  const list=document.getElementById('list'); list.innerHTML='';
  if(!lessons.length){
    list.innerHTML='<div class="empty"><strong>Пар немає 🎉</strong>На цей день занять не вказано.</div>';
    return;
  }

  lessons.forEach(x=>{
    const subj=week==='I'?x.week_I:x.week_II;
    const card=document.createElement('section');
    card.className='card';
    card.innerHTML=`<div><div class="time">${x.time}</div><div class="pair">${x.pair} пара</div></div>
      <div><div class="subject">${subj}</div>
      <div class="meta">
        ${x.teacher?`<span class="pill">👤 ${x.teacher}</span>`:''}
        ${x.room?`<span class="pill room">📍 ${x.room}</span>`:''}
      </div></div>`;
    list.appendChild(card);
  });
}

let startX=0,startY=0;
const swipe=document.getElementById('swipeArea');
swipe.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY;},{passive:true});
swipe.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-startX;
  const dy=e.changedTouches[0].clientY-startY;
  if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.3){
    const i=days.indexOf(day);
    if(dx<0 && i<days.length-1) setDay(days[i+1]);
    if(dx>0 && i>0) setDay(days[i-1]);
  }
},{passive:true});

render();
</script>
</body>
</html>
